[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasybacktesting"
version = "0.1.0"
description = "Point-in-time NBA fantasy ingestion and strategy evaluation"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<4", "pyarrow>=18,<27", "nba_api>=1.10,<2", "scikit-learn>=1.5,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
