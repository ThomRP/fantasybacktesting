[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasybacktesting"
version = "0.2.0"
description = "NBA game data, consensus ADP, and an All-Star surge backtest"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "pyarrow>=18,<27", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
